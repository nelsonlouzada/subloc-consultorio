name: CI
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: subloc
          POSTGRES_PASSWORD: subloc
          POSTGRES_DB: subloc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U subloc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://subloc:subloc@localhost:5432/subloc
      BETTER_AUTH_SECRET: segredo-so-para-ci-segredo-so-para-ci
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run tipos
      - run: npm run db:migrar
      - run: npm test
      - run: npm run build
      # Informativo: mostra vulnerabilidades conhecidas sem derrubar o build (parte delas vem de dentro do Next).
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
